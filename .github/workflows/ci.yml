name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - run: python -m pytest -q
      - run: npm run test:sdk
      - run: npm run test:edge
      - run: npm run test:frontend
  container-story:
    name: Flight Deck container and browser story
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: python tests/e2e/story.py
        env:
          DC_CONTAINER_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-container-story
          path: test-results/container-story/
          retention-days: 7
